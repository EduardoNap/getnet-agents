services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - state:/app/state  # conversations, tickets, audit log and the demo keys survive restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Optional: `docker compose --profile monitoring up` adds Prometheus with the alert rules loaded.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api

volumes:
  state:
