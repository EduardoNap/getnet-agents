# Prometheus for the demo: scrapes the assistant and evaluates the alert rules.
#   docker compose --profile monitoring up        then open http://localhost:9090/alerts
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: getnet-agents
    static_configs:
      - targets: ["api:8000"]
